services:
  # ============================================================
  # 本地开发：独立容器 mf-postgres(5432) + mf-redis(6379)
  # 生产部署：docker compose up 启动独立 mf-postgres + mf-redis + app
  #   - ngrok 直接代理 app 的 9000 端口
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: mf-postgres
    restart: unless-stopped
    # 仅容器间可访问，不映射到主机；本地开发如需从主机连接，用 docker-compose.override.yml 覆盖端口映射（需自行创建该文件）
    expose:
      - '5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monoforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-monoforge_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-monoforge_user} -d ${POSTGRES_DB:-monoforge_database}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mf-redis
    restart: unless-stopped
    # 仅容器间可访问，不映射到主机；本地开发如需从主机连接，用 docker-compose.override.yml 覆盖端口映射（需自行创建该文件）
    expose:
      - '6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # e2e 专用 postgres：独立数据卷，与 DEV(5432) 完全隔离
  # 启动：docker compose up -d e2e-postgres
  # 重置：docker compose down -v e2e-postgres（删数据卷）
  # 注：5433 仅绑定 127.0.0.1（e2e 脚本按 localhost:5433 直连），不对局域网暴露
  # ============================================================
  e2e-postgres:
    image: postgres:16-alpine
    container_name: mf-e2e-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${E2E_POSTGRES_USER:-e2e_user}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:-e2e_password}
      POSTGRES_DB: ${E2E_POSTGRES_DB:-monoforge_e2e_db}
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${E2E_POSTGRES_USER:-e2e_user} -d ${E2E_POSTGRES_DB:-monoforge_e2e_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  # 单容器：前后端同端口 9000，ngrok 直接代理此端口即可
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTP_PROXY:-}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTP_PROXY:-}
    container_name: mf-app
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-monoforge_user}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-monoforge_database}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, set it in .env (min 32 chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required, set it in .env (min 32 chars)}
      - API_PORT=9000
      - ALLOW_ORIGIN=${ALLOW_ORIGIN:-http://localhost:9000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # 生产强制 COOKIE_SECURE 的逃生舱（ngrok/单容器 HTTP 调试场景），见 docs/CONFIGURATION.md
      - ALLOW_INSECURE_COOKIE=${ALLOW_INSECURE_COOKIE:-false}
      - ALLOW_SETUP=${ALLOW_SETUP:-false}
      - ADMIN_ROLE_ID=${ADMIN_ROLE_ID:-1}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - APP_NAME=${APP_NAME:-MonoForge}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-10}
      - WEAPP_APPID=${WEAPP_APPID:-}
      - WEAPP_SECRET=${WEAPP_SECRET:-}
      - WECHAT_REDIRECT_URI=${WECHAT_REDIRECT_URI:-}
    volumes:
      - uploads_data:/app/uploads
      - uploads_trash_data:/app/uploads-trash
      - backups_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  uploads_trash_data:
  backups_data:
  e2e_postgres_data:
