packages:
  - "apps/*"
  - "packages/*"

# pnpm 10.32 起 settings 移至 pnpm-workspace.yaml（根 package.json 的 "pnpm" 字段不再读取）
overrides:
  axios: ">=1.20.0"
  body-parser: ">=2.4.0"
  engine.io: ">=6.6.10"
  follow-redirects: ">=1.16.2"
  handlebars: ">=4.7.10"
  js-yaml: ">=4.3.2"
  nodemailer: ">=10.3.1"
  proxy-addr: ">=2.0.8"
  qs: ">=6.16.1"
  seroval: ">=1.6.8"
  seroval-plugins: ">=1.6.8"
  socket.io-parser: ">=4.2.7"
  zod: ">=4.6.6"
  multer: ">=2.5.0"
  # L11：drizzle-kit 传递依赖 esbuild 0.18.20（dev-only）；已知 dev-server 系公告修复线在 0.25+
  esbuild: ">=0.25.0"

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - argon2
