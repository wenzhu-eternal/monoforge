name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@monoforge/shared exec tsc --noEmit
      - run: pnpm --filter=@monoforge/shared exec tsc --noEmit -p tsconfig.test.json
      - run: pnpm --filter=@monoforge/server exec tsc --noEmit
      - run: pnpm --filter=@monoforge/server exec tsc --noEmit -p tsconfig.test.json
      - run: pnpm --filter=@monoforge/web exec tsc --noEmit
      - run: pnpm --filter=@monoforge/e2e exec tsc --noEmit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/security-check.sh

  # 单元测试：Mock DB，快速验证 service/controller 逻辑
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # API 冒烟测试：真实 DB，验证后端全量 API 可用性
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long-xyz
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-must-be-at-least-32-chars-long-xyz
      NODE_ENV: test
      # M7：默认密码 888888 时 seed 强制首登改密，冒烟 GET /users 会 401 连锁全挂——CI 显式豁免
      SEED_ADMIN_MUST_CHANGE_PASSWORD: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@monoforge/server db:migrate
      - run: pnpm --filter=@monoforge/server db:seed
      - run: pnpm --filter=@monoforge/server test:e2e:ci

  # Playwright 全链路 e2e：真实 DB + 浏览器，验证前端 UI + 后端 API 全链路
  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long-xyz
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-must-be-at-least-32-chars-long-xyz
      NODE_ENV: development
      # e2e 期间调高限流，避免频繁登录触发 429
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      # M6：login/register/send-register-code 各为独立 default 桶（不共享计数）
      THROTTLE_LOGIN_LIMIT: 1000
      # M7：默认密码强制首登改密会让 e2e 首步 GET /users 401 全套崩，显式豁免
      SEED_ADMIN_MUST_CHANGE_PASSWORD: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@monoforge/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter=@monoforge/server db:migrate
      - run: pnpm --filter=@monoforge/server db:seed
      - run: pnpm test:e2e

  # 生产镜像冒烟：unit/e2e/smoke 全部跑在 src 侧，Dockerfile 镜像层没有任何门在看——
  # H1（packages/shared/dist 漏拷）曾十轮全绿逃逸。此 job 构建镜像 + 起容器 + 轮询 /health，
  # 把"容器启动即 MODULE_NOT_FOUND"这类产物级故障挡在合并前
  docker-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long-xyz
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-must-be-at-least-32-chars-long-xyz
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t monoforge:ci .
      - name: 启动生产镜像并轮询 /health
        run: |
          docker run -d --name monoforge-smoke --network host \
            -e NODE_ENV=production \
            -e API_PORT=9000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e ALLOW_ORIGIN=http://localhost:3000 \
            -e COOKIE_SECURE=true \
            monoforge:ci
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9000/api/v1/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs monoforge-smoke
          if [ -z "$ok" ]; then echo "容器 120s 内未通过 /health"; exit 1; fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, unit-test, smoke-test, e2e-test, docker-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
